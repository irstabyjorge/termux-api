name: Release APK Build Artifact (separate from release assets)

on:
  release:
    types:
      - published

# This workflow only reads source and uploads a short-lived Actions artifact.
# It never edits, deletes, or uploads assets to the published GitHub Release.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout published tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if ! printf '%s' "$VERSION" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
            echo "::error::Tag '$RELEASE_TAG' is not a valid SemVer version."
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          export TERMUX_API_APP__BUILD__APK_VERSION_TAG="${RELEASE_TAG}+github.debug"
          ./gradlew --no-daemon assembleDebug

      - name: Validate APK and generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="./app/build/outputs/apk/debug"
          APK_FILE="$APK_DIR/termux-api-app_${RELEASE_TAG}+github.debug.apk"
          if [[ ! -f "$APK_FILE" ]]; then
            echo "::error::Expected debug APK was not produced: $APK_FILE"
            echo "Files found:"
            find "$APK_DIR" -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi
          (cd "$APK_DIR" && sha256sum "$(basename "$APK_FILE")" > checksums-sha256.txt)
          cat "$APK_DIR/checksums-sha256.txt"

      - name: Upload APK as a separate Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-api-debug-apk-${{ github.event.release.tag_name }}
          path: |
            app/build/outputs/apk/debug/termux-api-app_${{ github.event.release.tag_name }}+github.debug.apk
            app/build/outputs/apk/debug/checksums-sha256.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
